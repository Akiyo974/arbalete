[package]
name = "arbalete"
version = "0.4.1"
edition = "2024"
license = "MPL-2.0"
publish = false
autobins = false

[[bin]]
name = "arbalete"
path = "src/main.rs"

[[bin]]
name = "arbalete_helper"
path = "src/bin/helper.rs"

[package.metadata.cef.bundle]
helper_name = "arbalete_helper"
# Copied into the macOS bundle; arbalete.icns becomes the app icon.
resources_path = "resources"

[dependencies]
arbalete-core = { path = "../crates/arbalete-core" }
cef = { workspace = true }
# International hosts in their own letters in the link status pill; already built, for cef's
# build script.
idna = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# The Linux interface (app/src/gtk.rs, docs/decisions/0011-linux-interface.md): GTK 4, and its
# X11 windows, which the pages' containers go in.
[target.'cfg(target_os = "linux")'.dependencies]
gdk4-x11 = "0.11.5"
gtk4 = { version = "0.11.5", features = ["gio_v2_80", "v4_14"] }

[target.'cfg(target_os = "macos")'.dependencies]
# On Windows the sandbox needs a separate bootstrap executable: not set up yet.
cef = { workspace = true, features = ["sandbox"] }
# The handler of the event monitor that catches the clicks opening the sidebar's menus.
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "block2",
    "NSAccessibility",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSSharingService",
    "NSText",
    "NSTextField",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
] }
